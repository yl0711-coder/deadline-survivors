[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-survivors"
version = "0.2.1"
description = "A local Python arcade survival game about fixing bugs, dodging meetings, and surviving production outages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.5,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
