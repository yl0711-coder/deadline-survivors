[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-survivors"
version = "0.2.6"
description = "A local Python arcade survival game about fixing bugs, dodging meetings, and surviving production outages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame-ce>=2.5,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"run_game.py" = ["E402"]
"tests/test_game.py" = ["E402"]
"tests/test_input.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = [
  "src/deadline_survivors/combat.py",
  "src/deadline_survivors/encounters.py",
  "src/deadline_survivors/state_factory.py",
]
