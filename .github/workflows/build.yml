name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall src run_game.py

      - name: Run headless tests
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --paths src --onedir --windowed --name deadline-survivors run_game.py

      - name: Build standalone binary
        if: runner.os != 'macOS'
        run: pyinstaller --noconfirm --clean --paths src --onefile --windowed --name deadline-survivors run_game.py

      - name: Smoke test Linux binary
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
        run: ./dist/deadline-survivors --smoke-test

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
        run: ./dist/deadline-survivors.exe --smoke-test

      - name: Smoke test macOS app binary
        if: runner.os == 'macOS'
        env:
          SDL_VIDEODRIVER: dummy
        run: ./dist/deadline-survivors.app/Contents/MacOS/deadline-survivors --smoke-test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deadline-survivors-${{ matrix.os }}
          path: dist/**
